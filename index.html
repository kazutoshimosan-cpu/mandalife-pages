<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>MandaLife Support</title>
  <style>
    :root {
      --paper: #f4f6f0;
      --ink: #20332e;
      --muted: #64736c;
      --line: rgba(32, 51, 46, .14);
      --panel: #fffffb;
      --accent: #d4bf78;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.75;
    }

    main {
      width: min(100% - 32px, 760px);
      margin: 0 auto;
      padding: 56px 0 72px;
    }

    header {
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      margin: 0 0 8px;
      font-size: 34px;
      font-weight: 500;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
    }

    p,
    li {
      color: var(--muted);
      font-size: 16px;
    }

    .grid {
      display: grid;
      gap: 16px;
      margin-top: 28px;
    }

    .card {
      display: block;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      color: inherit;
      text-decoration: none;
    }

    .card strong {
      display: block;
      margin-bottom: 6px;
      color: var(--ink);
      font-size: 18px;
    }

    footer {
      margin-top: 42px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="brand">MandaLife</p>
      <h1>Support and Policy</h1>
      <p>MandaLifeのサポート情報とプライバシーポリシーです。</p>
    </header>

    <section class="grid">
      <a class="card" href="./support.html">
        <strong>Support</strong>
        <span>お問い合わせ先、FAQ、購入復元の案内</span>
      </a>

      <a class="card" href="./privacy.html">
        <strong>Privacy Policy</strong>
        <span>データの取り扱いとプライバシーに関する案内</span>
      </a>
    </section>

    <footer>
      <span>&copy; 2026 MandaLife</span>
    </footer>
  </main>
</body>
</html>
